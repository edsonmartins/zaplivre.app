# Anti-órfã: toda tela principal precisa ser alcançável pela navegação
# Regressão: AND-13 (Settings/Profile/Search ficaram órfãs por meses)
appId: com.zaplivre
---
- runFlow: common/_setup_identity.yml

# Busca global
- tapOn:
    id: "conversations_search"
- assertVisible:
    id: "search_input"
- back

# Grupos
- tapOn:
    id: "conversations_groups"
- assertVisible: "Grupos"
- back

# Configurações (backup de identidade mora aqui!)
- tapOn:
    id: "conversations_settings"
# Em telas menores o item fica abaixo da dobra
- scrollUntilVisible:
    element: "Exportar backup da identidade"
    direction: DOWN
# "Sair" fica no fim da LazyColumn de Configurações — rola até aparecer
- scrollUntilVisible:
    element: "Sair"
    direction: DOWN
- assertVisible: "Sair"
- back
