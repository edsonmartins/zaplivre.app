# Onboarding: primeira execução → criar identidade → Conversas
# Regressão: IDN-01 (auto-init não pode atropelar o onboarding)
# Único flow com clearState — os demais reaproveitam a identidade via
# common/_setup_identity.yml e são independentes de ordem.
appId: com.zaplivre
---
- clearState
- evalScript: ${output.e2e_username = 'u' + Date.now()}
# Pré-concede notificações (Android 13+): o diálogo cobriria o onboarding
- launchApp:
    permissions:
      notifications: allow
# Tela de onboarding deve aparecer (sem identidade ainda)
# Espera o primeiro desenho (a inicialização do Keystore pode ser lenta no
# emulador) em vez de afirmar na hora.
- extendedWaitUntil:
    visible:
      id: "onboarding_create"
    timeout: 30000
- assertVisible: "ZapLivre"
- tapOn:
    id: "onboarding_create"
# Registro de username (diálogo) antes do Peer ID
- extendedWaitUntil:
    visible: "Escolha seu username"
    timeout: 15000
# O AlertDialog do Compose cria uma janela própria: o testTag precisa de
# testTagsAsResourceId no conteúdo do diálogo (onboarding_username_input/
# onboarding_register), que não herda o flag da raiz do MainActivity.
- tapOn:
    id: "onboarding_username_input"
- inputText: ${output.e2e_username}
- tapOn:
    id: "onboarding_register"
# Registro concluído: auto-navega para Conversas (identidade + username criados)
- extendedWaitUntil:
    visible:
      id: "conversations_settings"
    timeout: 30000
