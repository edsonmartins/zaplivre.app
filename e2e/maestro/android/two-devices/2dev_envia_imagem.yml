# 2-devices: envia imagem no tablet (photo picker → 1ª imagem → Concluir → Send)
appId: com.zaplivre
---
- launchApp
- extendedWaitUntil:
    visible: "poco1786296087"
    timeout: 15000
- tapOn: "poco1786296087"
- extendedWaitUntil:
    visible: "Pick images"
    timeout: 10000
- tapOn: "Pick images"
- extendedWaitUntil:
    visible: "Grade de mídia"
    timeout: 8000
- tapOn:
    text: "Item Foto.*"
    index: 0
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 5000
- tapOn: "Concluir"
- extendedWaitUntil:
    visible: "Send"
    timeout: 8000
- tapOn: "Send"
