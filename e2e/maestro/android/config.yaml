# Configuração da suíte Android.
# Só os flows numerados na raiz são executáveis; common/ contém helpers
# (chamados via runFlow) e fica fora da execução direta.
# Os flows de dois aparelhos ficam em two-devices/ e são rodados manualmente
# (exigem duas contas combinadas entre si). O Maestro faz o parse de todo .yml
# do diretório antes de filtrar, então mantê-los aqui quebrava a suíte inteira.
flows:
  - "*.yml"
executionOrder:
  continueOnFailure: true
