name: E2E Android (Maestro)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/**'
      - 'e2e/**'
      - '.github/workflows/e2e-android.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'core/**'
      - 'e2e/**'
      - '.github/workflows/e2e-android.yml'

env:
  # Fixar versão: flows usam evalScript/${output} (requer >= 1.30)
  MAESTRO_VERSION: 1.39.13
  # As .so nativas vêm do step cargo-ndk; pula o buildRustCore do Gradle.
  ORG_GRADLE_PROJECT_skipNativeBuild: "true"

jobs:
  maestro-android:
    name: Maestro flows (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Não-bloqueante: app ainda não inicializa de forma confiável no emulador
    # CI (adb/emulador instáveis). O job reporta o resultado real, mas não
    # trava o PR. Rever ao estabilizar (PLANO_HOMOLOGACAO Fase E).
    continue-on-error: true
    # Identity server próprio do job: o onboarding Android registra o username,
    # e depender do servidor de produção derrubava a suíte inteira quando ele
    # estava fora (HTTP 502 em set/26: 10/10 flows falhando no onboarding).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zaplivre
          POSTGRES_DB: zaplivre_identity
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (protoc, cmake)
        # protoc: build.rs do spqr-syft (libsignal PQXDH). cmake: audiopus_sys (Opus, --features voip).
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake postgresql-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O default da action ainda pede o pacote `tools`, que o sdkmanager
          # atual não tem mais: o step falhava antes de qualquer build.
          packages: platform-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Só x86_64: é a arch do emulador; corta ~75% do build Rust
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust core (x86_64 only)
        run: |
          cd core
          cargo ndk -t x86_64 -o ../android/app/src/main/jniLibs build --release --features voip

      - name: Start identity server
        env:
          DATABASE_URL: postgres://zaplivre@localhost:5432/zaplivre_identity
          REDIS_URL: redis://localhost:6379
        run: |
          psql "$DATABASE_URL" -f server/identity/schema.sql
          cargo build -p zaplivre-identity-server
          # 0.0.0.0: o emulador alcança o host por 10.0.2.2
          BIND_ADDR=0.0.0.0:8083 RATE_LIMIT_DISABLED=1 \
            nohup ./target/debug/zaplivre-identity-server > identity-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8083/health && exit 0
            sleep 1
          done
          cat identity-server.log
          exit 1

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        env:
          # O core (Rust) faz o registro; a política de cleartext do Android não
          # se aplica aos sockets nativos, então HTTP para o host funciona.
          IDENTITY_SERVER_URL: http://10.0.2.2:8083
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test e2e/maestro/android/ --format junit --output maestro-android-report.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-failure
          path: |
            ~/.maestro/tests/**
            maestro-android-report.xml
            identity-server.log
          if-no-files-found: ignore

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-report
          path: maestro-android-report.xml
          if-no-files-found: ignore
